name: OTA Update Production

on:
  push:
    branches: [master]

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ota:
    name: Build & Publish OTA Update
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm i -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint check
        run: npx expo lint

      - name: Authenticate with Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        # `eas` dipasang global oleh expo-github-action; eas-cli bukan dependency lokal.
        run: eas update --branch production --message "OTA update from commit ${{ github.sha }}"

      - name: Notify success
        if: success()
        run: echo "OTA update published successfully to channel production"
