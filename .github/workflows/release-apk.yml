name: Build & Release APK

# Push tag vX.Y.Z (atau manual dispatch) -> EAS preview build -> GitHub Release
# dengan APK. Aplikasi mengecek release ini lewat GitHub API dan menginstal
# langsung dari HP — tanpa Play Store, tanpa buka GitHub.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: app.json version)'
        required: false

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: EAS preview build (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      apk_url: ${{ steps.build.outputs.apk_url }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm i -g npm@11.19.0

      - name: Resolve version
        id: version
        run: |
          v=$(node -p "require('./app.json').expo.version")
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (EAS preview)
        id: build
        run: |
          # blocking; prints JSON with artifacts.buildUrl (direct APK) when finished
          eas build --platform android --profile preview --non-interactive --json > /tmp/build.json
          url=$(node -pe "const j=JSON.parse(require('fs').readFileSync('/tmp/build.json'));const b=(j.builds||[j.build])[0];b.artifacts.buildUrl")
          [ -n "$url" ] || { echo 'no APK artifact'; cat /tmp/build.json; exit 1; }
          echo "apk_url=$url" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -fLo app-release.apk "$apk_url"
        env:
          apk_url: ${{ steps.build.outputs.apk_url }}

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-release.apk

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in v*) ;; *) tag="v${{ needs.build.outputs.version }}";; esac
          notes=$(git log -1 --pretty=%B)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" app-release.apk --clobber
          else
            gh release create "$tag" -m "$tag" -m "$notes" --prerelease app-release.apk
          fi
